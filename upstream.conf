# Upstream lighttpd release this port is built from.
UPSTREAM_NAME=lighttpd
UPSTREAM_VERSION=1.4.85
UPSTREAM_URL=https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.85.tar.xz
UPSTREAM_SHA256=18de51b393bac4a6827879e1a7ff377c169e414bae92cd245091d80fc2601d13
# Glenn Strauss (lighttpd) <gstrauss@gluelogic.com>; releases are signed by the
# signing subkey ACAA8EC8C9703EAEB349258E86EFB5FBAF16D0F0 of this primary key.
# Public key: keys/lighttpd-signing-key.asc
UPSTREAM_GPG_KEY=649D0DD767FF206202A76C5158F14A786FE198C8
# Our patch level on top of the upstream release (1.4.85-vms1)
VMS_PATCH_LEVEL=1
# Dependencies built by the sibling repos on each node, in the same work
# directory: <workdir>.<TREE>.INSTALL_<arch>] (INCLUDE, LIB).  VSI C builds,
# like lighttpd itself here (docs/DECISIONS.md D2).
ZLIB_VERSION=1.3.2
ZLIB_TREE=ZLIB-1_3_2
PCRE2_VERSION=10.49
PCRE2_TREE=PCRE2-10_49
# TLS: VSI's SSL3 kit (OpenSSL 3.0); its shared images are a prerequisite.
SSL_KIT=SSL3
# Kit naming: VSI ships no lighttpd, but keep the VMS prefix like the siblings.
KIT_PRODUCT=VMSLIGHTTPD
