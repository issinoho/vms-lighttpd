# lighttpd.conf - lighttpd for OpenVMS (VMSLIGHTTPD)
#
# Written by VMSLIGHTTPD$CONFIGURE.COM from VMSLIGHTTPD$ROOT:[CONF]LIGHTTPD.CONF
# into the data directory; edit this copy.  Paths are UNIX form
# (/DEVICE/DIR/SUBDIR/file).  Includes must use absolute paths: lighttpd cannot
# derive a directory from a VMS file specification.
# After a change: @VMSLIGHTTPD$ROOT:[COM]VMSLIGHTTPD$CONTROL RESTART
# Reference: https://redmine.lighttpd.net/projects/lighttpd/wiki/Docs_Configuration

var.data = "@DATA@"

server.modules = (
    "mod_extforward",
    "mod_access",
    "mod_accesslog",
    "mod_alias",
    "mod_redirect",
    "mod_rewrite",
    "mod_setenv",
    "mod_expire",
    "mod_deflate",
    "mod_fastcgi",
    "mod_openssl"
)
# mod_indexfile, mod_dirlisting and mod_staticfile are added by lighttpd after
# these; don't list them, or mod_staticfile would come before mod_fastcgi.

server.document-root = var.data + "/htdocs"
server.errorlog      = var.data + "/logs/error.log"
accesslog.filename   = var.data + "/logs/access.log"
server.upload-dirs   = ( var.data + "/tmp" )

# Ports below 1024 need OPER: VMSLIGHTTPD$STARTUP installs LIGHTTPD.EXE with it,
# and lighttpd drops every privilege except TMPMBX,NETMBX once bound.
server.port = @PORT@

# Connections are limited by the account's FILLM and BYTLM quotas
# (VMSLIGHTTPD$CONFIGURE sets them); lighttpd takes its fd limit from FILLM.

index-file.names = ( "index.php", "index.html" )
# directory listings are off by default; to enable: dir-listing.activate = "enable"
# never send PHP source, even if no backend takes a .php request
static-file.exclude-extensions = ( ".php", ".inc" )

include var.data + "/conf/mime.conf"

# PHP over FastCGI: the pool VMSLIGHTTPD$BOOT starts with PHP_POOL.COM
@FASTCGI@

# HTTPS: put the certificate, its chain and the private key in one PEM file
# (readable by the service account only) and uncomment.  lighttpd 1.4.85
# accepts TLS 1.3 only unless MinProtocol is lowered.
#$SERVER["socket"] == ":443" {
#    ssl.engine  = "enable"
#    ssl.pemfile = var.data + "/conf/server.pem"
#    # ssl.openssl.ssl-conf-cmd = ( "MinProtocol" => "TLSv1.2" )
#}

# Behind a reverse proxy that ends TLS (Nginx Proxy Manager, HAProxy, ...):
# trust its X-Forwarded-For and X-Forwarded-Proto headers, so the logs, PHP's
# REMOTE_ADDR and HTTPS show the client's address and scheme.  List only the
# proxy's addresses: anyone trusted here can claim any client address.
#extforward.forwarder = ( "192.0.2.10" => "trust" )
#extforward.headers   = ( "X-Forwarded-For" )

# phpBB in the document root: uncomment (see [VMSLIGHTTPD.CONF]PHPBB.CONF)
#include var.data + "/conf/phpbb.conf"
