# phpbb.conf - lighttpd rules for phpBB 3.3 (from phpBB's docs/lighttpd.sample.conf).
# Include it inside the site's block, after setting server.document-root to the
# phpBB directory and fastcgi.server to the PHP pool (vmsport/php/php_pool.com):
#
#   include "phpbb.conf"
#
# Needs mod_access and mod_rewrite in server.modules.

index-file.names = ( "index.php", "index.html" )
dir-listing.activate = "disable"

# never send PHP source, even if no backend takes a .php request
static-file.exclude-extensions = ( ".php", ".inc" )

# phpBB's private files: configuration, cache, uploads, code
$HTTP["url"] =~ "^/(config|common\.php|cache|files|images/avatars/upload|includes|phpbb|store|vendor)" {
    url.access-deny = ( "" )
}
$HTTP["url"] =~ "^/composer\.(json|lock)$" {
    url.access-deny = ( "" )
}
$HTTP["url"] =~ "/\.svn|/\.git|/\.htaccess|/\.htpasswd|/\.htgroups" {
    url.access-deny = ( "" )
}

# phpBB's routes (app.php/...) for URLs that are not files.  Only paths that
# do not end in "/": rewrite-if-not-file also fires for directories (they are
# not regular files) before mod_indexfile adds index.php, so phpBB's sample
# rule turned "/" and "/adm/" into app.php routes and phpBB answered 404.
url.rewrite-if-not-file = (
    "^/install/([^?]*[^/?])(\?.*)?$" => "/install/app.php/$1$2",
    "^/([^?]*[^/?])(\?.*)?$" => "/app.php/$1$2"
)
