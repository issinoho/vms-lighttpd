; PHP.INI for the lighttpd FastCGI pool with VSI's PHP 8.0 kit (PHP$ROOT,
; PHP$ROOT:[CSWS]PHP-CGI.EXE), e.g. on IA64.  Same settings as php.ini
; (the PHP 8.1 kit), but this kit loads mysqli/pdo_mysql from
; PHP$ROOT:[LIB.EXTENSIONS] and has OPcache built in.  It has no gd or
; mbstring, which phpBB wants.  @POOL@ is the pool directory in UNIX form.

[PHP]
engine = On
short_open_tag = Off
expose_php = Off
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = @POOL@/logs/php_errors.log
post_max_size = 32M
file_uploads = On
upload_max_filesize = 16M
max_file_uploads = 20
upload_tmp_dir = @POOL@/tmp
sys_temp_dir = @POOL@/tmp
default_charset = "UTF-8"
allow_url_fopen = On
allow_url_include = Off

cgi.fix_pathinfo = 1
cgi.force_redirect = 0

; mysqli needs mysqlnd, which this kit's mysqli image has built in (loading
; mysqlnd.exe separately fails: it wants LIBGD$SHR)
extension_dir = "/php$root/lib/extensions"
extension = mysqli
extension = pdo_mysql

[Date]
date.timezone = UTC

[Session]
session.save_handler = files
session.save_path = "@POOL@/sessions"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440

[opcache]
opcache.enable = 1
; /tmp does not exist on OpenVMS
opcache.lockfile_path = @POOL@/tmp
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
