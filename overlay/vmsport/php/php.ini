; PHP.INI for the lighttpd FastCGI pool (vmsport/php/php_pool.com).
; Used instead of the system php.ini (PHP_CGI.EXE -c).  Paths are UNIX form.
; Sized for phpBB 3.3; adjust the limits to taste.  Copy to the pool
; directory; php_pool.com creates its LOGS, SESSIONS and TMP subdirectories.
; @POOL@ is replaced with the pool directory in UNIX form by the test setup.

[PHP]
engine = On
short_open_tag = Off
expose_php = Off
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = @POOL@/logs/php_errors.log
post_max_size = 32M
file_uploads = On
upload_max_filesize = 16M
max_file_uploads = 20
upload_tmp_dir = @POOL@/tmp
sys_temp_dir = @POOL@/tmp
default_charset = "UTF-8"
allow_url_fopen = On
allow_url_include = Off

; lighttpd passes SCRIPT_FILENAME and PATH_INFO; keep PHP's own fix-up
cgi.fix_pathinfo = 1
cgi.force_redirect = 0

; mysqli, mysqlnd, pdo_mysql, gd, mbstring, json, xml, zlib, openssl are
; built into PHP_ROOT's PHP_CGI.EXE (the 8.1.23 kit on x86, 8.0.29 on IA64);
; load extras from here, e.g. extension = php_curl (not in every kit)
extension_dir = "/php_root/extensions"

[Date]
date.timezone = UTC

[Session]
session.save_handler = files
session.save_path = "@POOL@/sessions"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440

[opcache]
zend_extension = php_opcache
opcache.enable = 1
; the default lock file directory is /tmp, which OpenVMS lacks: PHP then
; stops at startup with "Unable to create lock file: bad file number"
opcache.lockfile_path = @POOL@/tmp
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
